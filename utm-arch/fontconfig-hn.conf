<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The house Helvetica Neue in the utm-arch VM, installed by Home Manager
  (utm-home.nix) as ~/.config/fontconfig/conf.d/60-hn.conf.

  The files are the assistant repo's fonts/hn-*.ttf, copied into
  ~/.local/share/fonts/hn by utm-arch build/hn-fonts.sh (they are licensed to
  Sami and are not in this public repo). Each file names itself as its own
  family (hn-light, hn-medium, ...) with no weight, so at scan time they become
  one family, HN, with real weights. The file names follow the house CSS weights
  300/500/700/900; the fonts inside are Helvetica Neue LT Pro 55 Roman, 65
  Medium, 75 Bold and 85 Heavy.

  Run `fc-cache -f` after a change here: scan rules only apply when the cache is
  rebuilt (build/hn-fonts.sh does).
-->
<fontconfig>
  <match target="scan">
    <test name="family"><string>hn-light</string></test>
    <edit name="family" mode="assign" binding="same"><string>HN</string></edit>
    <edit name="style" mode="assign" binding="same"><string>Roman</string></edit>
    <edit name="weight" mode="assign" binding="same"><int>80</int></edit>
  </match>
  <match target="scan">
    <test name="family"><string>hn-medium</string></test>
    <edit name="family" mode="assign" binding="same"><string>HN</string></edit>
    <edit name="style" mode="assign" binding="same"><string>Medium</string></edit>
    <edit name="weight" mode="assign" binding="same"><int>100</int></edit>
  </match>
  <match target="scan">
    <test name="family"><string>hn-bold</string></test>
    <edit name="family" mode="assign" binding="same"><string>HN</string></edit>
    <edit name="style" mode="assign" binding="same"><string>Bold</string></edit>
    <edit name="weight" mode="assign" binding="same"><int>200</int></edit>
  </match>
  <match target="scan">
    <test name="family"><string>hn-black</string></test>
    <edit name="family" mode="assign" binding="same"><string>HN</string></edit>
    <edit name="style" mode="assign" binding="same"><string>Heavy</string></edit>
    <edit name="weight" mode="assign" binding="same"><int>210</int></edit>
  </match>

  <!-- Helvetica, as the Mac's Emacs and pages ask for it, is HN here. -->
  <alias binding="same">
    <family>Helvetica</family>
    <prefer><family>HN</family></prefer>
  </alias>
  <alias binding="same">
    <family>Helvetica Neue</family>
    <prefer><family>HN</family></prefer>
  </alias>
</fontconfig>
